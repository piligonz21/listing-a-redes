<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Listing to Social</title>
<meta name="description" content="Pegá el link de una propiedad y obtené el carrusel, las historias, la portada y un reel animado para Instagram.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="wrap" style="max-width:520px">
  <h1>Listing to Social</h1>
  <p class="lead">Del link de una propiedad al carrusel, las historias y el reel, listos para Instagram.</p>
  <form id="f" class="box">
    <p class="eyebrow">Acceso</p>
    <label for="code">Tu código de acceso</label>
    <input id="code" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" placeholder="XXXXX-XXXXX">
    <div style="margin-top:14px"><button class="primary" id="go" style="width:100%">Entrar</button></div>
    <div id="msg" class="msg" role="status"></div>
  </form>
  <p class="foot">Cada código funciona en hasta 2 dispositivos (por ejemplo, tu celu y tu compu).</p>
</main>
<script>
const $=id=>document.getElementById(id);
function device(){ let d=null; try{ d=localStorage.getItem("lar_device"); }catch(e){}
  if(!d){ d=[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,"0")).join(""); try{ localStorage.setItem("lar_device",d); }catch(e){} } return d; }
async function login(code){
  $("go").disabled=true; $("msg").className="msg"; $("msg").textContent="Verificando…";
  try{
    const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code,device:device()})});
    const j=await r.json().catch(()=>({}));
    if(r.ok){ location.href="/app"; return; }
    $("msg").className="msg bad"; $("msg").textContent=j.error||"No se pudo entrar.";
  }catch(e){ $("msg").className="msg bad"; $("msg").textContent="Sin conexión. Probá de nuevo."; }
  $("go").disabled=false;
}
$("f").onsubmit=e=>{e.preventDefault(); const c=$("code").value.trim(); if(c) login(c);};
const q=new URLSearchParams(location.search).get("code");
if(q){ $("code").value=q; history.replaceState(null,"","/"); login(q); }
else fetch("/app",{method:"HEAD",redirect:"manual"}).then(r=>{ if(r.status===200) location.href="/app"; }).catch(()=>{});
</script>
</body>
</html>
